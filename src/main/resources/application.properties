spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.jpa.open-in-view=true
spring.jpa.show-sql=true

# Servidor
server.port=${PORT:8080}
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# Logs
logging.level.org.springframework.security=DEBUG

# Correo
mail.default.host=${MAIL_DEFAULT_HOST:smtp.gmail.com}
mail.default.port=${MAIL_DEFAULT_PORT:587}
mail.default.starttls=${MAIL_DEFAULT_STARTTLS:true}

# Seguridad JWT
security.jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# OCR local para capturas de consulta censal; la carpeta debe contener spa.traineddata y eng.traineddata.
app.ocr.tessdata-path=${OCR_TESSDATA_PATH:./tessdata}
app.ocr.languages=${OCR_LANGUAGES:spa+eng}

# Capturas pequeñas y en memoria; no se almacenan en disco.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
